services:

  db-test:
    image: postgres:17.0
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres-test
    volumes:
      - /home/sp28337/docker_volume/postgres-test:/var/lib/postgresql/data

  cache-test:
    image: redis:7.2.4-alpine
    restart: always
    ports:
      - "6379:6379"