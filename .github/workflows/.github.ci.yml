name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Black
        run: poetry run black app --check

      - name: Run Ruff
        run: poetry run ruff check app

  tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run unit tests
        run: poetry run pytest tests/unit

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  deploy:
    name: Deploy to production
    needs: tests
    runs-on: ubuntu-latest
    environment: manicel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "🚀 Starting deployment"

            cd ~/manicel/backend

            export PATH="$HOME/.local/bin:$PATH"

            git fetch origin
            git checkout main
            git pull origin main

            sudo systemctl daemon-reload
            sudo systemctl restart manicel-backend.service

            echo "⏳ Waiting for service..."
            sleep 3

            if ! sudo systemctl is-active --quiet manicel-backend.service; then
              echo "❌ Service failed to start"
              sudo journalctl -u manicel-backend.service -n 50 --no-pager
              exit 1
            fi

            echo "✅ Deployment successful"
