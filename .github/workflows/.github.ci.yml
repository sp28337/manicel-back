name: CI/CD Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Black formatter check
        run: poetry run black app --check --diff

      - name: Run Ruff linter
        run: poetry run ruff check app --diff

  tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --no-root

      - name: Start test services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run unit tests
        run: poetry run pytest tests/unit -v

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  deploy:
    name: Deploy to Production
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: manicel
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            echo "🚀 Starting deployment..."

            cd ~/manicel/backend || { echo "❌ Failed to change directory"; exit 1; }

            export PATH="$HOME/.local/bin:$PATH"

            git fetch origin main || { echo "❌ Failed to fetch"; exit 1; }
            git checkout main || { echo "❌ Failed to checkout"; exit 1; }
            git pull origin main || { echo "❌ Failed to pull"; exit 1; }

            echo "📦 Pulling latest code..."

            echo "🔄 Restarting service..."
            sudo systemctl daemon-reload || { echo "❌ Failed to reload systemd"; exit 1; }
            sudo systemctl restart manicel-backend.service || { echo "❌ Failed to restart"; exit 1; }

            echo "⏳ Waiting for service to start..."
            sleep 3

            if ! sudo systemctl is-active --quiet manicel-backend.service; then
              echo "❌ Service failed to start!"
              sudo journalctl -u manicel-backend.service -n 50 --no-pager
              exit 1
            fi

            echo "🏥 Running health check..."
            if ! curl -sf http://localhost:8000/app/ping > /dev/null 2>&1; then
              echo "❌ Health check failed!"
              exit 1
            fi

            echo "✅ Deployment successful!"