name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run:
        |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    - name: Black
      run: poetry run black app
    - name: Ruff
      run: poetry run ruff check app --check --diff

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run:
          |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Start docker-compose.test
        run:
          |
          docker compose down
          docker compose -f docker-compose.test.yml  up -d
      - name: Run Unit tests
        run: poetry run pytest tests/unit
      - name: Stop docker-compose.test
        run: docker compose down

  deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: manicel

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to server via SSH
      run:
        |
        ssh -o StrictHostKeyChecking=no sp28337@109.73.207.195 -p ${{ secrets.PORT }} "
          cd ~/manicel/backend &&
          export PATH="~/.local/bin/poetry" ;
          export PATH="~/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH" ;
          git switch main ;
          echo '=== Restarting service ===' &&
          sudo systemctl daemon-reload &&
          sudo systemctl stop manicel-backend.service &&
          git pull &&
          sudo systemctl start manicel-backend.service &&
          echo '=== Verifying service ===' &&
          sudo systemctl status manicel-backend.service
        "