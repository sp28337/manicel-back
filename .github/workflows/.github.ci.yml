name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run:
        |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    - name: Black
      run: poetry run black app
    - name: Ruff
      run: poetry run ruff check app

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run:
          |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Start docker-compose.test
        run:
          |
          docker compose down
          docker compose -f docker-compose.test.yml  up -d
      - name: Run Unit tests
        run: poetry run pytest tests/unit
      - name: Stop docker-compose.test
        run: docker compose down

  deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: manicel

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to server via SSH
      run:
        |
        ssh -o StrictHostKeyChecking=no sp28337@109.73.207.195 -p ${{ secrets.PORT }} "
          cd ~/manicel/backend &&
          export PATH="~/.local/bin/poetry" ;
          export PATH="~/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH" ;
          export NVM_DIR="~/.nvm" ;
          [ -s "$NVM_DIR/nvm.sh" ] ;
          source "~/.nvm/nvm.sh" ;
          nvm install 22.15.1 &&
          nvm use 22.15.1 ;
          git switch dev ;
          npm install pm2 -g &&
          pm2 update &&
          pm2 stop backend &&
          git pull &&  
          pm2 start backend
        "
