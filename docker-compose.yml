services:
  backend:
    container_name: backend_container
    build:
      dockerfile: ./Dockerfile
      context: ./
    ports:
      - '8000:8000'
    depends_on:
      - db
#      - redis
    networks:
      - manicel_network

  db:
    container_name: postgres_container
    image: postgres:17.0
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - /home/sp28337/docker_volume/postgres:/var/lib/postgresql/data
    networks:
      - manicel_network

# ! Do not use default redis settings in prod due to high chance to get
# miner-viruse that make your CPU up to 100% !
