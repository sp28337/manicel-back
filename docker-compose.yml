services:

  db:
    image: postgres:17.0
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - /home/sp28337/docker_volume/postgres:/var/lib/postgresql/data